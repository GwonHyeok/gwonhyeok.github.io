  <title>404 — 페이지를 찾을 수 없습니다 | GHPlanet</title>
  <meta name="description" content="요청하신 페이지를 찾을 수 없습니다. GHPlanet 홈으로 이동하세요." />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" href="/profile/me.png" type="image/png" />
  <link rel="stylesheet" href="/styles.css" />
  <script>
    // SPA-friendly 404: redirect to root, preserving the original path as hash.
    // App reads pathname/hash on mount and routes to the closest match.
    (function () {
      var path = window.location.pathname;
      var search = window.location.search || "";
      // If we accidentally land here on /index.html, just go to /.
      if (!path || path === "/" || path === "/index.html") {
        window.location.replace("/");
        return;
      }
      // Preserve original path in sessionStorage so the SPA can react if needed.
      try { sessionStorage.setItem("__404_from", path + search); } catch (e) {}
      window.location.replace("/");
    })();
  </script>
